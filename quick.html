<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>빠른 보기 · 컴퓨터시스템</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1f2330;--sub:#6b7185;--pri:#4f46e5;--bd:#e3e5ef;--mk:#fde68a}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf2;--sub:#9aa1b8;--pri:#818cf8;--bd:#2c3040;--mk:#6b5a14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}a{color:var(--pri);text-decoration:none;font-size:15px}
.chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-top:12px}
.tag{font-size:12px;font-weight:700;color:var(--pri)}
.q{font-weight:700;margin:2px 0 8px;word-break:keep-all}
.a{border-top:1px dashed var(--bd);padding-top:8px;word-break:keep-all}
.a small{color:var(--sub)}
details.exp{margin-top:10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:15px;word-break:keep-all}
details.exp summary{cursor:pointer;font-weight:700;color:var(--pri)}
code{background:var(--bd);border-radius:4px;padding:0 4px;font-size:.92em}
mark{background:var(--mk);color:inherit;border-radius:4px;padding:0 3px}
img{max-width:100%;display:block;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<header><div class="row"><h1>📄 빠른 보기</h1><a href="index.html">← 문제 풀기</a></div>
<div class="chips" id="chips"></div></header>
<div id="list"></div>
</div>
<script src="data.js"></script>
<script>
const Q=window.QUESTIONS,K=window.KEY||{},EXP=window.EXP||{};
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const imgs=a=>(a||[]).map(n=>`<img src="img/${n}.jpg" loading="lazy" alt="">`).join("");
function mark(html,keys){ // 태그는 그대로 두고 텍스트 노드의 키워드만 <mark> 처리
  if(!keys||!keys.length) return html;
  const re=new RegExp("("+keys.slice().sort((a,b)=>b.length-a.length).map(esc).join("|")+")","g");
  const d=document.createElement("div");d.innerHTML=html;
  const walk=n=>[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){
      if(!re.test(c.textContent)){re.lastIndex=0;return}
      re.lastIndex=0;
      const sp=document.createElement("span");
      sp.innerHTML=c.textContent.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(re,"<mark>$1</mark>");
      c.replaceWith(sp);
    } else walk(c);
  });
  walk(d);return d.innerHTML;
}
const pools=["전체",...new Set(Q.map(q=>q.pool))];
let cur="전체";
function render(){
  document.getElementById("chips").innerHTML=pools.map(p=>`<button class="chip ${p===cur?'on':''}" data-p="${p}">${p}</button>`).join("");
  document.getElementById("list").innerHTML=Q.filter(q=>cur==="전체"||q.pool===cur).map(q=>`
  <div class="card"><div class="tag">${q.pool} · ${q.n}번</div>
  <div class="q">${q.q}${imgs(q.img)}</div>
  <div class="a">${mark(q.a,K[q.id])}${imgs(q.aimg)}${EXP[q.id]?`<details class="exp" open><summary>💡 해설 (접기/펼치기)</summary><div style="margin-top:6px">${EXP[q.id]}</div></details>`:""}</div></div>`).join("");
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cur=b.dataset.p;render();scrollTo(0,0)});
}
render();
</script>
</body>
</html>
